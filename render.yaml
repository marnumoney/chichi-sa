services:
  - type: web
    name: webdesign-ai
    runtime: node
    rootDir: webdesign-ai
    buildCommand: npm install
    startCommand: node agent/agent.js
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OWNER_EMAIL
        value: marnupersonal53@gmail.com

  - type: web
    name: chichi-api
    runtime: python
    rootDir: chichi-api
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: chihuahuasouthafrica@gmail.com
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        value: ""
      - key: FRONTEND_URL
        value: https://chihuahuasouthafrica.com
      - key: BACKEND_URL
        value: https://chichi-api-7k6y.onrender.com
