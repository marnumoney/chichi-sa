name: Keep Chichi API Alive

# Disabled until new backend URL is confirmed
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping chichi-api health
        env:
          API_URL: ${{ vars.CHICHI_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "CHICHI_API_URL not set — update this workflow with the correct URL"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL/health")
          echo "Status: $status"
          if [ "$status" != "200" ]; then
            echo "Warning: chichi-api returned $status"
            exit 1
          fi
