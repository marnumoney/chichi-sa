name: Keep Chichi API Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping chichi-api health
        env:
          API_URL: https://chichi-api-7k6y.onrender.com/health
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "$API_URL")
          echo "Status: $status"
          if [ "$status" != "200" ]; then
            echo "Warning: chichi-api returned $status"
            exit 1
          fi
