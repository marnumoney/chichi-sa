services:
  - type: web
    name: chichi-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DB_PATH
        value: /tmp/chichi.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: chihuahuasouthafrica@gmail.com
      - key: ADMIN_PASSWORD_HASH
        value: "$2b$12$e7L/LEmMy1wy7onm3F5U6uug3ipH1UiEj4DfIIgmz8sidk4JF9ZJa"
      - key: SMTP_USER
        value: chihuahuasouthafrica@gmail.com
      - key: SMTP_PASSWORD
        sync: false
