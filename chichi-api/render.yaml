services:
  - type: web
    name: chichi-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PATH
        value: /tmp/chichi.db
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: chihuahuasouthafrica@gmail.com
      - key: ADMIN_PASSWORD_HASH
        value: "$2b$12$8pR2ejrJiQ.JPzsWh/Dfd.Z8TzDROMXFEOgsYfqHLiIyjfHwPgwTS"
